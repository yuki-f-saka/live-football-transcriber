name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff · mypy · pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the version used for development.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # sounddevice loads libportaudio at import time, and the tests import it.
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2

      - name: Install
        # mlx-whisper and pyobjc are marked sys_platform == "darwin" and are
        # skipped here; everything the tests touch is pure Python.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest
